<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CraDet – Signup</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
    }
  }
  </script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🛡️</span>
        <span class="logo-text">CraDet</span>
      </div>
      <div class="header-status">
        <span class="dot active"></span>
        <span>Signup</span>
      </div>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p>Register a new user to save your emergency contacts and access the accident alert dashboard.</p>
      <form id="signupForm" class="auth-form">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" placeholder="Enter your full name" required />
        <label for="signupEmail">Email Address</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required />
        <label for="signupPhone">Phone Number</label>
        <input type="tel" id="signupPhone" placeholder="Enter your phone number" required />
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="Create a password" required />
        <div id="authMessage" class="auth-message"></div>
        <button type="submit" class="auth-button">Signup</button>
      </form>
      <div class="auth-footer">
        <span>Already have an account? <a href="login.html" class="auth-link">Login</a></span>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>CraDet © 2025 · Simple frontend authentication demo</p>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
